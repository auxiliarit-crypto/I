services:
  postgres:
    image: postgres:16-alpine
    container_name: index_itsm_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: index_user
      POSTGRES_PASSWORD: index_pass
      POSTGRES_DB: index_itsm
      TZ: America/Guatemala
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U index_user -d index_itsm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: index_itsm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
